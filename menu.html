<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - 909 LUMINA GARDEN LOUNGE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body { background: #000; }
        .page-header-title {
            text-align: center; margin: 120px 0 40px;
            font-size: 40px; text-transform: uppercase;
        }
        .menu-wrapper {
            border: 2px solid transparent;
            border-image: var(--border-gradient);
            border-image-slice: 1;
            padding: 50px;
            margin: 0 10%;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255,0,255,0.2), 0 0 20px rgba(0,243,255,0.2);
            background: rgba(10, 10, 15, 0.6);
        }
        .menu-image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }
        .menu-page-img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid var(--primary-cyan);
            box-shadow: var(--glow-cyan);
            transition: all 0.4s ease;
            object-fit: cover;
        }
        .menu-page-img:nth-child(even) {
            border-color: var(--primary-magenta);
            box-shadow: var(--glow-magenta);
        }
        .menu-page-img:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            border-color: #fff;
        }
        
        @media (max-width: 992px) {
            .menu-wrapper { margin: 0 5%; padding: 30px; }
        }
        @media (max-width: 768px) {
            .menu-image-grid { grid-template-columns: 1fr; }
            .menu-wrapper { margin: 0 15px; padding: 20px; }
        }
    </style>
</head>
<body>
    <header class="header scrolled">
        <div class="nav-container">
            <ul class="nav-links left-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="index.html#about">Giới thiệu</a></li>
                <li><a href="menu.html" class="active">Menu</a></li>
            </ul>
            <div class="logo">
                <a href="index.html">
                    <h1><span>909</span> LUMINA</h1>
                    <p>GARDEN LOUNGE</p>
                </a>
            </div>
            <ul class="nav-links right-links">
                <li><a href="gallery.html">Hình ảnh</a></li>
                <li><a href="news.html">Tin tức</a></li>
                <li><a href="index.html#booking">Liên hệ</a></li>
            </ul>
        </div>
    </header>

    <h1 class="page-header-title glow-text-cyan" data-aos="fade-down">THỰC ĐƠN</h1>
    
    <div class="menu-wrapper" data-aos="zoom-in">
        <div class="menu-image-grid">
            <!-- Ảnh Menu Cuốn (Trang 1) -->
            <img src="menu1.png" alt="Menu Trang 1" class="menu-page-img">
            
            <!-- Ảnh Menu Cuốn (Trang 2) -->
            <img src="menu2.png" alt="Menu Trang 2" class="menu-page-img">
            
            <!-- Ảnh Menu Cuốn (Trang 3) -->
            <img src="manu3.png" alt="Menu Trang 3" class="menu-page-img">
            
            <!-- Ảnh Menu Cuốn (Trang 4) -->
            <img src="menu4.png" alt="Menu Trang 4" class="menu-page-img">
        </div>
    </div>
    
    <div style="height: 100px;"></div>

    <div class="floating-actions">
        <a href="https://zalo.me/0123456789" target="_blank" class="float-btn zalo-btn"><strong>Zalo</strong></a>
        <a href="#" class="float-btn chat-btn"><i class="fab fa-facebook-messenger"></i></a>
        <a href="#" class="float-btn up-btn" id="scrollTopBtn"><i class="fas fa-chevron-up"></i></a>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 100 });
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) scrollTopBtn.classList.add('show');
            else scrollTopBtn.classList.remove('show');
        });
        scrollTopBtn.addEventListener('click', (e) => {
            e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
