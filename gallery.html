<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hình Ảnh - 909 LUMINA GARDEN LOUNGE</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-attachment: fixed;
            background-size: cover;
        }
        .page-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: -1;
        }
        .page-header-title {
            text-align: center; margin: 120px 0 40px;
            font-size: 40px; text-transform: uppercase;
        }
        .gallery-wrapper {
            width: 100%;
            padding: 0 8vw 100px;
            margin: 0;
        }
        .gallery-grid-new {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .gallery-card {
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--primary-cyan);
            box-shadow: var(--glow-cyan);
            aspect-ratio: 1/1;
            position: relative;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        /* Alternate borders */
        .gallery-card:nth-child(even) {
            border-color: var(--primary-magenta);
            box-shadow: var(--glow-magenta);
        }
        /* Hover Effect */
        .gallery-card:hover {
            border-color: var(--primary-magenta) !important;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.8) !important;
            transform: translateY(-5px);
            z-index: 2;
        }
        .gallery-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-card:hover img {
            transform: scale(1.15);
        }
        
        @media (max-width: 1200px) { .gallery-grid-new { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 992px) { .gallery-grid-new { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 576px) { .gallery-grid-new { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="page-overlay"></div>
    <header class="header scrolled">
        <div class="nav-container">
            <ul class="nav-links left-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="index.html#about">Giới thiệu</a></li>
                <li><a href="menu.html">Menu</a></li>
            </ul>
            <div class="logo">
                <a href="index.html">
                    <h1><span>909</span> LUMINA</h1>
                    <p>GARDEN LOUNGE</p>
                </a>
            </div>
            <ul class="nav-links right-links">
                <li><a href="gallery.html" class="active">Hình ảnh</a></li>
                <li><a href="news.html">Tin tức</a></li>
                <li><a href="index.html#booking">Liên hệ</a></li>
            </ul>
        </div>
    </header>

    <h1 class="page-header-title glow-text-cyan" data-aos="fade-down">HÌNH ẢNH</h1>

    <div class="gallery-wrapper">
        <div class="gallery-grid-new">
            <div class="gallery-card" data-aos="zoom-in" data-aos-delay="0"><img src="https://images.unsplash.com/photo-1574096079513-d8259312b78a?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"></div>
            <div class="gallery-card" data-aos="zoom-in" data-aos-delay="100"><img src="https://images.unsplash.com/photo-1545128485-c400e7702796?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"></div>
            <div class="gallery-card" data-aos="zoom-in" data-aos-delay="200"><img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"></div>
            <div class="gallery-card" data-aos="zoom-in" data-aos-delay="300"><img src="https://images.unsplash.com/photo-1566737236500-c8ac43014a67?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"></div>
            <div class="gallery-card" data-aos="zoom-in" data-aos-delay="0"><img src="https://images.unsplash.com/photo-1572116469696-31de0f17cecb?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"></div>
            <div class="gallery-card" data-aos="zoom-in" data-aos-delay="100"><img src="https://images.unsplash.com/photo-1566417713940-fe7c737a9ef2?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"></div>
            <div class="gallery-card" data-aos="zoom-in" data-aos-delay="200"><img src="https://images.unsplash.com/photo-1582806297380-49635b71900a?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"></div>
            <div class="gallery-card" data-aos="zoom-in" data-aos-delay="300"><img src="https://images.unsplash.com/photo-1549465220-1a8b9238cd48?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"></div>
        </div>
    </div>

    <div class="floating-actions">
        <a href="https://zalo.me/0123456789" target="_blank" class="float-btn zalo-btn"><strong>Zalo</strong></a>
        <a href="#" class="float-btn chat-btn"><i class="fab fa-facebook-messenger"></i></a>
        <a href="#" class="float-btn up-btn" id="scrollTopBtn"><i class="fas fa-chevron-up"></i></a>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50 });
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) scrollTopBtn.classList.add('show');
            else scrollTopBtn.classList.remove('show');
        });
        scrollTopBtn.addEventListener('click', (e) => {
            e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
